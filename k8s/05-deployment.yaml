---
# ─────────────────────────────────────────────────────────────────────────────
# LiteLLM Proxy — Deployment
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app: litellm
    app.kubernetes.io/part-of: ai-gateway
    app.kubernetes.io/component: proxy
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: litellm
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: litellm
    spec:
      serviceAccountName: litellm
      # Do NOT automount the SA token — not needed
      automountServiceAccountToken: false

      # ── Init Container: wait for Postgres to be ready ──────────────────────
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Postgres..."
              until nc -z postgres-service 5432; do
                echo "  postgres not ready, sleeping 2s..."
                sleep 2
              done
              echo "Postgres is ready."
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis..."
              until nc -z redis-service 6379; do
                echo "  redis not ready, sleeping 2s..."
                sleep 2
              done
              echo "Redis is ready."
        - name: wait-for-presidio-analyzer
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Presidio Analyzer..."
              until nc -z presidio-analyzer-service 5001; do
                echo "  presidio-analyzer not ready, sleeping 2s..."
                sleep 2
              done
              echo "Presidio Analyzer is ready."
        - name: wait-for-presidio-anonymizer
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Presidio Anonymizer..."
              until nc -z presidio-anonymizer-service 5002; do
                echo "  presidio-anonymizer not ready, sleeping 2s..."
                sleep 2
              done
              echo "Presidio Anonymizer is ready."
        - name: wait-for-llm-guard
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for LLM Guard..."
              until nc -z llm-guard-service 8000; do
                echo "  llm-guard not ready, sleeping 2s..."
                sleep 2
              done
              echo "LLM Guard is ready."

      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          imagePullPolicy: Always
          args:
            - "--config"
            - "/app/config/proxy_config.yaml"
            - "--port"
            - "4000"
            - "--detailed_debug" # verbose logging; remove in production if memory-constrained
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP

          # ── Environment Variables (injected from Secret) ─────────────────
          envFrom:
            - secretRef:
                name: litellm-api-keys

          # ── Guardrail Service Endpoints ──────────────────────────────────
          env:
            - name: PRESIDIO_ANALYZER_API_BASE
              value: "http://presidio-analyzer-service.litellm.svc.cluster.local:5001"
            - name: PRESIDIO_ANONYMIZER_API_BASE
              value: "http://presidio-anonymizer-service.litellm.svc.cluster.local:5002"
            - name: LLM_GUARD_API_BASE
              value: "http://llm-guard-service.litellm.svc.cluster.local:8000"

          # ── ConfigMap volume for proxy_config.yaml ───────────────────────
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
            - name: callbacks-volume
              mountPath: /app/callbacks
              readOnly: true

          # ── Resource Limits ──────────────────────────────────────────────
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"

          # ── Health Probes ────────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

          # ── Security Context ─────────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # LiteLLM writes tmp files
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

      volumes:
        - name: config-volume
          configMap:
            name: litellm-config
        - name: callbacks-volume
          configMap:
            name: registry-logger

      # Spread across nodes if you scale replicas
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: litellm
