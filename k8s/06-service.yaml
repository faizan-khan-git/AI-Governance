---
# ─────────────────────────────────────────────────────────────────────────────
# Service: litellm-internal
# ClusterIP service for pod-to-pod communication within the cluster
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: litellm-internal
  namespace: litellm
  labels:
    app: litellm
    app.kubernetes.io/part-of: ai-gateway
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      protocol: TCP
      port: 4000
      targetPort: 4000

---
# ─────────────────────────────────────────────────────────────────────────────
# Service: litellm-external
# NodePort service to expose LiteLLM on localhost:30080 for local curl testing.
# k3d maps this node port straight through to your Mac's localhost.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: litellm-external
  namespace: litellm
  labels:
    app: litellm
    app.kubernetes.io/part-of: ai-gateway
    app.kubernetes.io/component: proxy
spec:
  type: NodePort
  selector:
    app: litellm
  ports:
    - name: http
      protocol: TCP
      port: 4000
      targetPort: 4000
      nodePort: 30080        # fixed port for deterministic curl commands
