---
# ─────────────────────────────────────────────────────────────────────────────
# ConfigMap: LLM Guard Scanner Configuration (scanners.yml)
#
# Defines the input and output scanners for the LLM Guard API server.
# Scanners are applied in the order listed below.
#
# Input scanners run on the PII-masked prompt (after Presidio pre_call).
# Output scanners run on the LLM response (before Presidio rehydration).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-guard-scanners
  namespace: litellm
  labels:
    app: llm-guard
    app.kubernetes.io/part-of: ai-gateway
    app.kubernetes.io/component: llm-guard
data:
  scanners.yml: |
    app:
      name: "LLM Guard — AI Gateway Security"
      log_level: INFO
      log_json: true
      scan_fail_fast: false
      scan_prompt_timeout: 30
      scan_output_timeout: 30
      lazy_load: true

    rate_limit:
      enabled: false

    auth:
      type: http_bearer
      # Interpolated from the AUTH_TOKEN env var (injected from the
      # litellm-api-keys Secret). Empty token disables authentication.
      token: ${AUTH_TOKEN:}

    tracing:
      exporter: console

    metrics:
      exporter: prometheus

    # ═══════════════════════════════════════════════════════════════
    # Input Scanners — Applied to Inbound Prompts
    #
    # These run on the PII-masked prompt (Presidio has already
    # replaced sensitive data with [PERSON_1] etc. at this point).
    #
    # MEMORY NOTE (local single-node cluster):
    #   The Docker VM (~5.8GiB) cannot hold the ML transformer scanners
    #   (PromptInjection DeBERTa, Toxicity, BanTopics) alongside LiteLLM,
    #   Presidio, Postgres, and Redis — the pod gets OOMKilled.
    #   The zero-model BanSubstrings scanner below deterministically blocks
    #   the known jailbreak / prompt-injection patterns with a tiny footprint.
    #   To enable the ML PromptInjection + Toxicity scanners, raise Docker
    #   Desktop RAM to >=10GB, bump the pod memory limit (resources block
    #   below), then uncomment the ML scanners.
    # ═══════════════════════════════════════════════════════════════
    input_scanners:

      # ── Jailbreak / Prompt-Injection Guard (zero-model) ─────────
      # Catches known jailbreak patterns like "DAN", "ignore previous
      # instructions", "do anything now", and other role-play exploits
      # via substring matching. No transformer model — minimal memory.
      - type: BanSubstrings
        params:
          substrings:
            - "ignore previous instructions"
            - "ignore all previous"
            - "disregard your instructions"
            - "disregard all previous"
            - "forget your instructions"
            - "forget all previous"
            - "override your instructions"
            - "you are now DAN"
            - "you are DAN"
            - "dan mode"
            - "developer mode"
            - "jailbreak"
            - "do anything now"
            - "act as if you have no restrictions"
            - "without any restrictions"
            - "pretend you are"
            - "simulate a conversation"
            - "hypothetically speaking"
            - "in a fictional scenario"
            - "roleplay as"
          match_type: "word"
          case_sensitive: false
          redact: false
          contains_all: false

      # ── ML scanners (disabled: require >=10GB Docker RAM) ───────
      # Uncomment after raising Docker Desktop RAM + the pod memory limit.
      # - type: PromptInjection
      #   params:
      #     threshold: 0.5
      #     match_type: "full"
      # - type: Toxicity
      #   params:
      #     threshold: 0.7
      #     match_type: "sentence"
      # - type: BanTopics
      #   params:
      #     topics: ["violence", "illegal activities", "self-harm", "weapons manufacturing", "drug synthesis", "exploitation"]
      #     threshold: 0.75

    # ═══════════════════════════════════════════════════════════════
    # Output Scanners — Applied to LLM Responses
    #
    # These catch problems in the model's generated response before
    # it is returned to the caller.
    # ═══════════════════════════════════════════════════════════════
    output_scanners:

      # ── Secret / Token Leak Guard (zero-model) ──────────────────
      # Blocks responses that echo bearer tokens or common secret
      # patterns. Regex-based — no transformer model, minimal memory.
      # Presidio still rehydrates/guards output PII (defense-in-depth).
      - type: Regex
        params:
          patterns:
            - "Bearer [A-Za-z0-9-._~+/]+"
            - "sk-[A-Za-z0-9]{16,}"
          is_blocked: true
          match_type: search
          redact: false

      # ── ML scanners (disabled: require >=10GB Docker RAM) ───────
      # Uncomment after raising Docker Desktop RAM + the pod memory limit.
      # - type: Toxicity
      #   params:
      #     threshold: 0.7
      # - type: NoRefusal
      #   params:
      #     threshold: 0.5
      #     match_type: "full"
      # - type: Relevance
      #   params:
      #     threshold: 0.5
      # - type: BanTopics
      #   params:
      #     topics: ["violence", "illegal activities", "self-harm", "weapons manufacturing", "drug synthesis", "exploitation"]
      #     threshold: 0.75

---
# ─────────────────────────────────────────────────────────────────────────────
# LLM Guard API Server — Adversarial Security + Content Safety
#
# Runs the LLM Guard API server which exposes:
#   POST /analyze/scan   — scan input prompts
#   POST /analyze/output — scan LLM outputs
#
# Uses transformer-based classifiers (DeBERTa, etc.) for ML-based
# detection. Models are lazy-loaded on first request.
#
# Source: https://github.com/protectai/llm-guard
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-guard
  namespace: litellm
  labels:
    app: llm-guard
    app.kubernetes.io/part-of: ai-gateway
    app.kubernetes.io/component: llm-guard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-guard
  template:
    metadata:
      labels:
        app: llm-guard
    spec:
      containers:
        - name: llm-guard
          image: laiyer/llm-guard-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: SCAN_FAIL_FAST
              value: "false"
            - name: APP_WORKERS
              value: "1"
            # Bearer token required on /analyze/* requests. Shared with the
            # LiteLLM custom guardrail via the litellm-api-keys Secret.
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: litellm-api-keys
                  key: LLM_GUARD_API_KEY
          volumeMounts:
            - name: scanners-config
              mountPath: /home/user/app/config
              readOnly: true
          # Zero-model scanners (BanSubstrings + Regex) have a small footprint,
          # so this fits comfortably. If you re-enable the ML scanners
          # (PromptInjection DeBERTa + Toxicity), raise this to ~6Gi AND
          # increase Docker Desktop RAM to >=10GB, or the pod will be OOMKilled.
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      volumes:
        - name: scanners-config
          configMap:
            name: llm-guard-scanners

---
apiVersion: v1
kind: Service
metadata:
  name: llm-guard-service
  namespace: litellm
  labels:
    app: llm-guard
    app.kubernetes.io/part-of: ai-gateway
    app.kubernetes.io/component: llm-guard
spec:
  selector:
    app: llm-guard
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
