---
# ─────────────────────────────────────────────────────────────────────────────
# Redis — Rate-Limit Cache + PII Vault for LiteLLM
#
# The PII vault (callbacks/pii_vault_guardrail.py) keeps each request's
# token → original-value map in a pii_vault:<id> hash for a few minutes.
#
# Redis requires AUTH. REDIS_PASSWORD comes from the litellm-api-keys Secret and
# is embedded in REDIS_URL, so only clients holding the Secret can read the vault.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: litellm
  labels:
    app: redis
    app.kubernetes.io/part-of: ai-gateway
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          # redis:7-alpine, pinned by digest so a rebuild gets the validated build
          image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
          # in-memory only — PII vault entries must never be written to disk; AUTH required
          args: ["--save", "", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-api-keys
                  key: REDIS_PASSWORD
            # redis-cli (used by the probes) reads the password from REDISCLI_AUTH
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: litellm-api-keys
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: litellm
  labels:
    app: redis
    app.kubernetes.io/part-of: ai-gateway
spec:
  selector:
    app: redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
