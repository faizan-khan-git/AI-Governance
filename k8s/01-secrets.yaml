---
# ─────────────────────────────────────────────────────────────────────────────
# Secret: litellm-api-keys
#
# ⚠️  DO NOT store real API keys here.
#     bootstrap.sh uses `envsubst` to substitute ${GEMINI_API_KEY} etc.
#     from your shell environment before applying this file.
#     The file committed to Git always contains the placeholder strings below.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: litellm-api-keys
  namespace: litellm
  labels:
    app.kubernetes.io/part-of: ai-gateway
type: Opaque
stringData:
  # ── External Provider Keys ────────────────────────────────────────────────
  GEMINI_API_KEY: "${GEMINI_API_KEY}"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"

  # ── LiteLLM Internal Master Key ──────────────────────────────────────────
  # Used ONLY for admin operations: issuing/revoking virtual keys.
  # Change this to a strong random value before going to production.
  LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"

  # ── LiteLLM JWT Secret ───────────────────────────────────────────────────
  # Used to sign/verify JWT tokens issued by the RBAC endpoint.
  LITELLM_JWT_SECRET: "${LITELLM_JWT_SECRET}"

  # ── Database URL ─────────────────────────────────────────────────────────
  # Constructed from Postgres credentials; no need to change for local use.
  DATABASE_URL: "postgresql://litellm:litellmpassword@postgres-service.litellm.svc.cluster.local:5432/litellm"

  # ── Redis URL ────────────────────────────────────────────────────────────
  REDIS_URL: "redis://redis-service.litellm.svc.cluster.local:6379"
