---
# ─────────────────────────────────────────────────────────────────────────────
# ConfigMap: litellm-config
#
# Contains the full proxy_config.yaml that LiteLLM reads on startup.
# Mounted at /app/config/proxy_config.yaml inside the container.
#
# Design:
#   • Three model tiers:  flash (cheap) / standard / premium
#   • Router strategy:    least-busy (balances across providers)
#   • Budget tracking:    PostgreSQL (DATABASE_URL injected via Secret)
#   • Rate limiting:      Redis  (REDIS_URL injected via Secret)
#   • PII vault:          Redis  (per-request token map, short TTL)
#   • RBAC:               LiteLLM virtual keys with per-key model allowlists,
#                         RPM caps, and monthly budget ceilings
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
  labels:
    app.kubernetes.io/part-of: ai-gateway
data:
  proxy_config.yaml: |
    # ═══════════════════════════════════════════════════════════════
    # Model Definitions
    # ═══════════════════════════════════════════════════════════════
    model_list:

      # ── TIER 1: Flash / Cheap ─────────────────────────────────
      - model_name: gemini-flash
        litellm_params:
          model: gemini/gemini-2.5-flash
          api_key: os.environ/GEMINI_API_KEY
          # per-model hard limit: stop routing if cost crosses this
          max_budget: 10          # USD per month for this model slot
          budget_duration: "1mo"

      - model_name: gpt-3.5-turbo
        litellm_params:
          model: openai/gpt-3.5-turbo
          api_key: os.environ/OPENAI_API_KEY
          max_budget: 5
          budget_duration: "1mo"

      # ── TIER 2: Standard ─────────────────────────────────────
      - model_name: gemini-pro
        litellm_params:
          model: gemini/gemini-3.1-pro-preview
          api_key: os.environ/GEMINI_API_KEY
          max_budget: 25
          budget_duration: "1mo"

      - model_name: gpt-4o-mini
        litellm_params:
          model: openai/gpt-4o-mini
          api_key: os.environ/OPENAI_API_KEY
          max_budget: 15
          budget_duration: "1mo"

      # ── TIER 3: Premium ──────────────────────────────────────
      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
          api_key: os.environ/OPENAI_API_KEY
          max_budget: 50
          budget_duration: "1mo"

    # ═══════════════════════════════════════════════════════════════
    # Router Strategy
    # ═══════════════════════════════════════════════════════════════
    router_settings:
      routing_strategy: least-busy
      # Retry on failure before returning error
      num_retries: 2
      timeout: 60           # seconds per upstream request
      # Cooldown a provider for 60s after 3 consecutive failures
      cooldown_time: 60
      allowed_fails: 3

    # ═══════════════════════════════════════════════════════════════
    # General Proxy Settings
    # ═══════════════════════════════════════════════════════════════
    general_settings:
      # Master key — for admin API calls only (key issuance, revoke, spend)
      # Injected from Secret via LITELLM_MASTER_KEY env var
      master_key: os.environ/LITELLM_MASTER_KEY

      # Database for budget / spend / key management
      database_url: os.environ/DATABASE_URL

      # Disable the built-in Swagger UI in production-like environments
      # set to true if you want the /docs endpoint
      disable_swagger_ui: false

      # Store virtual key metadata in Postgres
      store_model_in_db: true

      # Drop params not supported by the target model (avoids 400 errors)
      drop_params: true

    # ═══════════════════════════════════════════════════════════════
    # Redis — Rate Limiting Cache
    # ═══════════════════════════════════════════════════════════════
    litellm_settings:
      cache: true
      cache_params:
        type: redis
        url: os.environ/REDIS_URL

      # Global safety: never let a SINGLE request cost more than $0.50
      max_budget: 0.50
      budget_duration: "1d"

      # Telemetry off — no data sent to LiteLLM cloud
      telemetry: false

      # ── Zero-Retention Architecture ──────────────────────────────
      # CRITICAL: Never store raw prompt/response text in any log sink.
      # Only non-sensitive metadata (tokens, cost, latency) is persisted.
      turn_off_message_logging: true
      store_prompts_in_spend_logs: false

      # ── Custom Metadata Logger (AI Registry Audit Log) ───────────
      # Logs token counts, latency, cost, and guardrail trigger events
      # to ai_registry.audit_log in PostgreSQL. Zero text retention.
      # Registered as a single CustomLogger instance (handles both
      # success and failure events) to avoid duplicate audit rows.
      callbacks: callbacks.registry_logger.proxy_handler_instance

    # ═══════════════════════════════════════════════════════════════
    # Environment Variables — Presidio Service Endpoints
    # ═══════════════════════════════════════════════════════════════
    environment_variables:
      PRESIDIO_ANALYZER_API_BASE: "http://presidio-analyzer-service.litellm.svc.cluster.local:5001"
      PRESIDIO_ANONYMIZER_API_BASE: "http://presidio-anonymizer-service.litellm.svc.cluster.local:5002"
      LLM_GUARD_API_BASE: "http://llm-guard-service.litellm.svc.cluster.local:8000"

    # ═══════════════════════════════════════════════════════════════
    # Guardrails — Presidio PII Vault (Redis) + LLM Guard
    #
    # Guardrails run in the order declared below, for both the request
    # (pre_call) and the response (post_call). The PII vault is split in
    # two entries so it wraps LLM Guard on both sides:
    #
    #   request : presidio-pii-guard (mask) → llm-guard-security (input)
    #   response: llm-guard-security (output) → presidio-pii-rehydrate
    #
    # PII flow (callbacks/pii_vault_guardrail.py):
    #   1. pre_call:  Presidio Analyzer detects PII → Presidio Anonymizer
    #                 replaces each value with a token ([PERSON_1],
    #                 [EMAIL_ADDRESS_1]) → token→value map is stored in
    #                 Redis (pii_vault:<id>, TTL vault_ttl_seconds)
    #   2. The LLM only ever receives the tokenized text
    #   3. post_call: the map is fetched from Redis, tokens in the reply
    #                 are replaced with the original values, and the vault
    #                 entry is deleted (single use)
    #
    # The native `guardrail: presidio` provider is NOT used: in current
    # LiteLLM it keeps the token map in proxy memory and, by default,
    # re-masks the restored reply (presidio_filter_scope=both), so users
    # saw <PERSON>/<EMAIL_ADDRESS> placeholders instead of their data.
    #
    # Entity actions:
    #   MASK  → replace with a vault token (reversible via rehydration)
    #   BLOCK → reject the request entirely (HTTP 400)
    # ═══════════════════════════════════════════════════════════════
    guardrails:
      # ── Layer 1a: PII Vault — mask (runs FIRST on the request) ──
      - guardrail_name: "presidio-pii-guard"
        litellm_params:
          guardrail: callbacks.pii_vault_guardrail.PIIVaultGuardrail
          mode: "pre_call"
          default_on: true
          presidio_analyzer_api_base: "http://presidio-analyzer-service.litellm.svc.cluster.local:5001"
          presidio_anonymizer_api_base: "http://presidio-anonymizer-service.litellm.svc.cluster.local:5002"
          presidio_language: "en"
          # Redis vault entry lifetime; must exceed the slowest LLM call
          # incl. retries (router: 60s timeout × 3 attempts).
          vault_ttl_seconds: 300

          # Terms the NER model wrongly tags as PERSON/LOCATION (e.g.
          # "Kubernetes" → LOCATION, "you are now DAN" → PERSON, which
          # would also hide the DAN jailbreak phrase from LLM Guard).
          # Matched exactly and case-sensitively against the WHOLE detected
          # span, so "Dan Smith" is still masked. Only list words that can
          # never be personal data: do NOT add first names or surnames
          # (Jenkins, Claude, ...) — that would let real PII through.
          presidio_allow_list:
            - "Kubernetes"
            - "Docker"
            - "Linux"
            - "Grafana"
            - "Prometheus"
            - "Istio"
            - "LangChain"
            - "Llama"
            - "DAN"

          # ── Entity detection + action matrix ─────────────────────
          # IN_* entities come from Presidio's India recognizers, enabled
          # via the recognizer registry in 08-presidio.yaml.
          pii_entities_config:
            PERSON: "MASK"
            EMAIL_ADDRESS: "MASK"
            PHONE_NUMBER: "MASK"
            CREDIT_CARD: "MASK"
            US_SSN: "MASK"
            IP_ADDRESS: "MASK"
            IBAN_CODE: "MASK"
            LOCATION: "MASK"
            IN_AADHAAR: "MASK"
            IN_PAN: "MASK"
            IN_PASSPORT: "MASK"
            IN_VEHICLE_REGISTRATION: "MASK"

          # ── Minimum confidence scores (0.0–1.0) ─────────────────
          # Calibrated against Presidio's recognizer scores. US_SSN: the
          # dashed form (123-45-6789) scores 0.5, or 0.85 with a context
          # word such as "SSN"; a bare 9-digit number scores only 0.05, or
          # 0.4 with a context word. At 0.4, "SSN 536904399" is masked
          # while a context-free 9-digit order/invoice number is not.
          # PHONE_NUMBER scores 0.4 without a context word. Higher
          # thresholds let real SSNs / phone numbers reach the model.
          # IN_AADHAAR is Verhoeff-checksum validated (1.0 when valid);
          # IN_PAN scores 0.85 for the strict pattern but 0.01 for loose
          # matches (e.g. "smith@acme"), IN_PASSPORT 0.45 with context.
          presidio_score_thresholds:
            PERSON: 0.7
            EMAIL_ADDRESS: 0.6
            PHONE_NUMBER: 0.4
            CREDIT_CARD: 0.8
            US_SSN: 0.4
            IP_ADDRESS: 0.6
            IBAN_CODE: 0.8
            LOCATION: 0.5
            IN_AADHAAR: 0.8
            IN_PAN: 0.5
            IN_PASSPORT: 0.4
            IN_VEHICLE_REGISTRATION: 0.8

      # ── Layer 2: LLM Guard — Adversarial Security ─────────────
      # Runs AFTER Presidio PII masking. Analyzes the prompt for
      # prompt injection, jailbreak exploits, toxicity, and banned
      # topics (pre_call), and the model response for data leaks,
      # toxic content, and banned topics (post_call).
      #
      # Implemented as a custom guardrail (callbacks/llm_guard_guardrail.py)
      # that calls the in-cluster LLM Guard API server. The native
      # `guardrail: llm_guard` provider was removed in current LiteLLM
      # releases, so it is silently ignored and must not be used here.
      - guardrail_name: "llm-guard-security"
        litellm_params:
          guardrail: callbacks.llm_guard_guardrail.LLMGuardGuardrail
          mode: ["pre_call", "post_call"]
          api_base: "http://llm-guard-service.litellm.svc.cluster.local:8000"
          default_on: true
          # Advisory scanners: hits are logged + written to the audit log as
          # guardrail_flagged but do not block. The DeBERTa PromptInjection
          # classifier scores benign "repeat my name/email" prompts at 1.00
          # (same as real attacks), so it cannot be enforced by threshold.
          # Remove it from this list to enforce once audit data justifies it.
          monitor_only_scanners: ["PromptInjection"]

      # ── Layer 1b: PII Vault — rehydrate (runs LAST on the response) ─
      # Fetches the token map from Redis (REDIS_URL) and restores the
      # caller's original values after LLM Guard has scanned the reply.
      - guardrail_name: "presidio-pii-rehydrate"
        litellm_params:
          guardrail: callbacks.pii_vault_guardrail.PIIVaultGuardrail
          mode: "post_call"
          default_on: true

    # ═══════════════════════════════════════════════════════════════
    # RBAC: Virtual Key Tiers
    # Provisioned via bootstrap.sh calling the /key/generate endpoint.
    # Stored here as documentation of the policies applied.
    #
    # Policy Matrix:
    #   dev      → gemini-flash, gpt-3.5-turbo | 60 RPM  | $5/mo
    #   standard → + gemini-pro, gpt-4o-mini   | 200 RPM | $20/mo
    #   admin    → all models                  | 1000 RPM| $100/mo
    # ═══════════════════════════════════════════════════════════════
