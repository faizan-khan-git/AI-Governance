---
# ─────────────────────────────────────────────────────────────────────────────
# ConfigMap: presidio-recognizers
#
# Recognizer registry for the Presidio Analyzer (RECOGNIZER_REGISTRY_CONF_FILE).
# Enables the India recognizers — IN_AADHAAR (Verhoeff-validated), IN_PAN,
# IN_PASSPORT, IN_VEHICLE_REGISTRATION. Which entities actually get masked, and
# at what score, is decided in k8s/04-configmap.yaml.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: presidio-recognizers
  namespace: litellm
  labels:
    app: presidio-analyzer
    app.kubernetes.io/part-of: ai-gateway
    app.kubernetes.io/component: presidio
data:
  recognizers.yaml: |
    supported_languages:
      - en
    global_regex_flags: 26

    recognizers:
      # Recognizers listed here can either be loaded from the recognizers defined in code (type: predefined),
      # or created based on the provided configuration (type: custom).
      # For predefined:
      # - If only a recognizer name is provided, a predefined recognizer with this name and default parameters will be loaded.
      # - If a parameter isn't provided, the default one would be loaded.
      # - Use 'class_name' to specify the Python class when using a custom 'name' for display/metadata
      # For custom:
      # - See an example configuration here: https://github.com/microsoft/presidio/blob/main/presidio-analyzer/presidio_analyzer/conf/example_recognizers.yaml
      # - Custom pattern recognizers with this configuration can be added to this file, with type: custom
      #  For recognizers supporting more than one language, an instance of the recognizer for each language will be created.
      # For example, see the CreditCardRecognizer definition below:
      - name: CreditCardRecognizer
        supported_languages:
        - language: en
          context: [credit, card, visa, mastercard, cc, amex, discover, jcb, diners, maestro, instapayment]
        - language: es
          context: [tarjeta, credito, visa, mastercard, cc, amex, discover, jcb, diners, maestro, instapayment]
        - language: it
        - language: pl
        type: predefined

      - name: UsBankRecognizer
        supported_languages:
        - en
        type: predefined

      - name: UsLicenseRecognizer
        supported_languages:
        - en
        type: predefined

      - name: UsItinRecognizer
        supported_languages:
        - en
        type: predefined

      - name: UsPassportRecognizer
        supported_languages:
        - en
        type: predefined

      - name: UsSsnRecognizer
        supported_languages:
        - en
        type: predefined

      - name: UsMbiRecognizer
        supported_languages:
        - en
        type: predefined
        enabled: false

      - name: UsNpiRecognizer
        supported_languages:
        - en
        type: predefined
        enabled: false

      - name: NhsRecognizer
        supported_languages:
        - en
        type: predefined

      - name: UkNinoRecognizer
        supported_languages:
        - en
        type: predefined
        enabled: false

      - name: UkPassportRecognizer
        supported_languages:
        - en
        type: predefined
        enabled: false

      - name: UkPostcodeRecognizer
        supported_languages:
        - en
        type: predefined
        enabled: false

      - name: UkVehicleRegistrationRecognizer
        supported_languages:
        - en
        type: predefined
        enabled: false

      - name: SgFinRecognizer
        supported_languages:
        - en
        type: predefined
        enabled: false

      - name: AuAbnRecognizer
        supported_languages:
        - en
        type: predefined
        enabled: false

      - name: AuAcnRecognizer
        supported_languages:
        - en
        type: predefined
        enabled: false

      - name: AuTfnRecognizer
        supported_languages:
        - en
        type: predefined
        enabled: false

      - name: AuMedicareRecognizer
        supported_languages:
        - en
        type: predefined
        enabled: false

      - name: NgNinRecognizer
        supported_languages:
        - en
        type: predefined
        enabled: false

      - name: NgVehicleRegistrationRecognizer
        supported_languages:
        - en
        type: predefined
        enabled: false

      - name: InPanRecognizer
        supported_languages:
        - en
        type: predefined

      - name: InAadhaarRecognizer
        supported_languages:
        - en
        type: predefined

      - name: InVehicleRegistrationRecognizer
        supported_languages:
        - en
        type: predefined

      - name: InPassportRecognizer
        supported_languages:
        - en
        type: predefined

      - name: EsNifRecognizer
        supported_languages:
        - es
        type: predefined

      - name: EsNieRecognizer
        supported_languages:
        - es
        type: predefined

      - name: ItDriverLicenseRecognizer
        supported_languages:
        - it
        type: predefined

      - name: ItFiscalCodeRecognizer
        supported_languages:
        - it
        type: predefined

      - name: ItVatCodeRecognizer
        supported_languages:
        - it
        type: predefined

      - name: ItIdentityCardRecognizer
        supported_languages:
        - it
        type: predefined

      - name: ItPassportRecognizer
        supported_languages:
        - it
        type: predefined

      - name: PlPeselRecognizer
        supported_languages:
        - pl
        type: predefined

      - name: KrBrnRecognizer
        supported_languages:
        - ko
        - kr
        type: predefined
        enabled: false

      - name: KrRrnRecognizer
        supported_languages:
        - ko
        - kr
        type: predefined
        enabled: false

      - name: KrDriverLicenseRecognizer
        supported_languages:
        - ko
        - kr
        type: predefined
        enabled: false

      - name: KrFrnRecognizer
        supported_languages:
        - ko
        - kr
        type: predefined
        enabled: false

      - name: ThTninRecognizer
        supported_languages:
        - th
        type: predefined
        enabled: false

      - name: HuggingFaceNerRecognizer
        supported_languages:
        - en
        type: predefined
        enabled: false

      - name: CryptoRecognizer
        type: predefined

      - name: DateRecognizer
        type: predefined

      - name: EmailRecognizer
        type: predefined

      - name: IbanRecognizer
        type: predefined

      - name: IpRecognizer
        type: predefined

      - name: MedicalLicenseRecognizer
        type: predefined

      - name: MacAddressRecognizer
        type: predefined

      - name: PhoneRecognizer
        type: predefined

      - name: UrlRecognizer
        type: predefined

      - name: InVoterRecognizer
        type: predefined
        enabled: false

      - name: InGstinRecognizer
        supported_languages:
        - en
        type: predefined
        enabled: false

      - name: BasicLangExtractRecognizer
        supported_languages:
          - en
        type: predefined
        enabled: false
        config_path: presidio_analyzer/conf/langextract_config_basic.yaml

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio-analyzer
  namespace: litellm
  labels:
    app: presidio-analyzer
    app.kubernetes.io/part-of: ai-gateway
    app.kubernetes.io/component: presidio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: presidio-analyzer
  template:
    metadata:
      labels:
        app: presidio-analyzer
    spec:
      containers:
        - name: presidio-analyzer
          # mcr.microsoft.com/presidio-analyzer:latest, pinned by digest so a rebuild gets the validated build
          image: mcr.microsoft.com/presidio-analyzer@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              value: "5001"
            # Recognizer registry with the India recognizers (see the ConfigMap above)
            - name: RECOGNIZER_REGISTRY_CONF_FILE
              value: /conf/recognizers.yaml
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: recognizers
              mountPath: /conf
              readOnly: true
      volumes:
        - name: recognizers
          configMap:
            name: presidio-recognizers

---
apiVersion: v1
kind: Service
metadata:
  name: presidio-analyzer-service
  namespace: litellm
  labels:
    app: presidio-analyzer
    app.kubernetes.io/part-of: ai-gateway
    app.kubernetes.io/component: presidio
spec:
  selector:
    app: presidio-analyzer
  ports:
    - name: http
      protocol: TCP
      port: 5001
      targetPort: 5001

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio-anonymizer
  namespace: litellm
  labels:
    app: presidio-anonymizer
    app.kubernetes.io/part-of: ai-gateway
    app.kubernetes.io/component: presidio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: presidio-anonymizer
  template:
    metadata:
      labels:
        app: presidio-anonymizer
    spec:
      containers:
        - name: presidio-anonymizer
          # mcr.microsoft.com/presidio-anonymizer:latest, pinned by digest so a rebuild gets the validated build
          image: mcr.microsoft.com/presidio-anonymizer@sha256:a10a12a2a613d13cf29d3ad3641e3258444dd8c90403dd644a0a114c472c2483
          ports:
            - containerPort: 5002
          env:
            - name: PORT
              value: "5002"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: presidio-anonymizer-service
  namespace: litellm
  labels:
    app: presidio-anonymizer
    app.kubernetes.io/part-of: ai-gateway
    app.kubernetes.io/component: presidio
spec:
  selector:
    app: presidio-anonymizer
  ports:
    - name: http
      protocol: TCP
      port: 5002
      targetPort: 5002
