---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio-analyzer
  namespace: litellm
  labels:
    app: presidio-analyzer
    app.kubernetes.io/part-of: ai-gateway
    app.kubernetes.io/component: presidio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: presidio-analyzer
  template:
    metadata:
      labels:
        app: presidio-analyzer
    spec:
      containers:
        - name: presidio-analyzer
          image: mcr.microsoft.com/presidio-analyzer:latest
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              value: "5001"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: presidio-analyzer-service
  namespace: litellm
  labels:
    app: presidio-analyzer
    app.kubernetes.io/part-of: ai-gateway
    app.kubernetes.io/component: presidio
spec:
  selector:
    app: presidio-analyzer
  ports:
    - name: http
      protocol: TCP
      port: 5001
      targetPort: 5001

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio-anonymizer
  namespace: litellm
  labels:
    app: presidio-anonymizer
    app.kubernetes.io/part-of: ai-gateway
    app.kubernetes.io/component: presidio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: presidio-anonymizer
  template:
    metadata:
      labels:
        app: presidio-anonymizer
    spec:
      containers:
        - name: presidio-anonymizer
          image: mcr.microsoft.com/presidio-anonymizer:latest
          ports:
            - containerPort: 5002
          env:
            - name: PORT
              value: "5002"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: presidio-anonymizer-service
  namespace: litellm
  labels:
    app: presidio-anonymizer
    app.kubernetes.io/part-of: ai-gateway
    app.kubernetes.io/component: presidio
spec:
  selector:
    app: presidio-anonymizer
  ports:
    - name: http
      protocol: TCP
      port: 5002
      targetPort: 5002
